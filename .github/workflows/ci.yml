name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: larder
          POSTGRES_PASSWORD: larder
          POSTGRES_DB: larder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U larder" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://larder:larder@localhost:5432/larder_test
      LARDER_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: API contract (OpenAPI → TS types up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make gen-api
      - name: Fail if generated files are stale
        run: |
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts \
            || { echo "::error::Generated API files are stale. Run 'make gen-api' and commit."; exit 1; }

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Docker (build + compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 180
      - name: API is ready (Postgres + Redis reachable)
        run: curl --fail --silent --show-error http://localhost:8000/readyz
      - name: Web renders and reaches the API
        run: curl --fail --silent --show-error http://localhost:3000/ | grep -q 'data-api-status="ok"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
