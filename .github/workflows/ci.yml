name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: larder
          POSTGRES_PASSWORD: larder
          POSTGRES_DB: larder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U larder" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://larder:larder@localhost:5432/larder_test
      LARDER_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: API contract (OpenAPI → TS types up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make gen-api
      - name: Fail if generated files are stale
        run: |
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts \
            || { echo "::error::Generated API files are stale. Run 'make gen-api' and commit."; exit 1; }

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the new commits' history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # The gitleaks hook only sees staged files, so it can't check commits made elsewhere
      # (e.g. GitHub's web editor). Scan every commit this PR or push adds.
      - name: Secret scan (new commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="$BASE..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact \
            --no-banner --log-opts="$range"

  docker:
    name: Docker (build + compose smoke test)
    runs-on: ubuntu-latest
    env:
      # Format-valid placeholder keys: enough to boot the stack, not to sign in.
      # A "live"-style key avoids Clerk's dev-instance handshake redirect for anonymous requests.
      CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5jb20k # gitleaks:allow (encodes clerk.example.com)
      CLERK_SECRET_KEY: sk_live_dummy
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 180
      - name: Migrations ran
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: API is ready (Postgres + Redis reachable)
        run: curl --fail --silent --show-error http://localhost:8000/readyz
      - name: API requires sign-in
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/me)" = "401"
      - name: Web renders and reaches the API
        run: curl --fail --silent --show-error http://localhost:3000/ | grep -q 'data-api-status="ok"'
      - name: App pages redirect signed-out visitors to sign-in
        run: |
          for page in plan pantry; do
            location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://localhost:3000/$page")
            echo "$page -> $location"
            case "$location" in http://localhost:3000/sign-in*) ;; *) exit 1 ;; esac
          done
      - name: Planner dependencies are in the API image
        run: docker compose exec -T api python -c "import ortools, larder_solver.problem"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  e2e:
    name: E2E (Playwright, phone viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: larder
          POSTGRES_PASSWORD: larder
          POSTGRES_DB: larder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U larder" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://larder:larder@localhost:5432/larder
      # A Clerk *development* instance; add both as repository secrets to enable this job.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PLAN_TIME_LIMIT_MS: "2000"
    steps:
      - name: Check for Clerk keys
        id: clerk
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::E2E skipped: add CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY repo secrets (Clerk dev instance) to enable."
          fi
      - uses: actions/checkout@v7
        if: steps.clerk.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.clerk.outputs.enabled == 'true'
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        if: steps.clerk.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.clerk.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Cache downloads (USDA zips, TheMealDB responses)
        if: steps.clerk.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: |
            data/cache/usda
            data/cache/mealdb
          key: seed-cache-${{ hashFiles('packages/data/src/larder_data/usda.py') }}
      - name: Database (migrate + seed foods and recipes)
        if: steps.clerk.outputs.enabled == 'true'
        run: |
          uv sync --locked
          make seed
      - name: Start API
        if: steps.clerk.outputs.enabled == 'true'
        run: |
          uv run uvicorn larder_api.main:app --port 8000 > api.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:8000/readyz
      - name: Build and start web
        if: steps.clerk.outputs.enabled == 'true'
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp -r public .next/standalone/apps/web/ && cp -r .next/static .next/standalone/apps/web/.next/
          (cd .next/standalone/apps/web && HOSTNAME=0.0.0.0 PORT=3000 API_URL=http://localhost:8000 node server.js > ../../../../web.log 2>&1 &)
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://localhost:3000/
      - name: Playwright
        if: steps.clerk.outputs.enabled == 'true'
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Logs and report on failure
        if: failure() && steps.clerk.outputs.enabled == 'true'
        run: tail -n 100 api.log apps/web/web.log || true
      - uses: actions/upload-artifact@v7
        if: failure() && steps.clerk.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
