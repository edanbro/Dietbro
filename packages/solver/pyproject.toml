[project]
name = "larder-solver"
version = "0.0.0"
description = "Weekly meal planning: CP-SAT model, independent validator, metrics. Pure, no I/O."
requires-python = ">=3.12"
dependencies = ["larder-core", "ortools>=9.15"]

[tool.uv.sources]
larder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_solver"]
