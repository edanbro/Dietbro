[[recipe]]
slug = "irish-stew"
name = "Irish stew"
category = "Lamb"
cuisine = "Irish"
servings = 4
instructions = """
Cut the lamb into chunks and the potatoes, carrots and onions into large pieces. Layer them in a
heavy pot with the thyme, season, and pour over the stock. Cover and simmer gently for about
1 1/2 hours until the lamb is tender and some of the potato has thickened the broth. Scatter
with parsley.
"""
ingredients = [
  ["lamb shoulder", "600g"],
  ["potato", "800g"],
  ["carrot", "300g"],
  ["onion", "2"],
  ["lamb stock", "750ml"],
  ["thyme", "1 tsp"],
  ["parsley", "2 tbsp"],
]

