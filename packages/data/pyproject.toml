[project]
name = "larder-data"
version = "0.0.0"
description = "USDA + recipe importers, ingredient normaliser, embeddings."
requires-python = ">=3.12"
dependencies = [
    "larder-core",
    "larder-db",
    "fastembed>=0.9",
    "httpx>=0.28",
    "numpy>=2.3",
]

[project.scripts]
larder-data = "larder_data.cli:main"

[tool.uv.sources]
larder-core = { workspace = true }
larder-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_data"]
