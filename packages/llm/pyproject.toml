[project]
name = "larder-llm"
version = "0.0.0"
description = "LLM layer: Claude client, typed plan changes and tools, agent loop, offline fallback."
requires-python = ">=3.12"
dependencies = ["larder-core", "anthropic>=1.9,<2", "pydantic>=2.12"]

[tool.uv.sources]
larder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_llm"]
