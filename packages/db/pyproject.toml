[project]
name = "larder-db"
version = "0.0.0"
description = "Database schema (SQLAlchemy models) and Alembic migrations."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "pgvector>=0.5",
    "sqlalchemy[asyncio]>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_db"]
