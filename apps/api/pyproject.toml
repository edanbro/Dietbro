[project]
name = "larder-api"
version = "0.0.0"
description = "Larder HTTP API (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "larder-core",
    "asyncpg>=0.32",
    "fastapi>=0.142",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
larder-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_api"]
