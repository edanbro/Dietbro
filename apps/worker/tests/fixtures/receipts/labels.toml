# Labelled receipt set for the M6 accuracy eval (larder_worker.evaluate, docs/receipt-accuracy.md).
#
# Each receipt lists the item lines a person would add to their pantry. `key` is a piece of
# the printed line that identifies it; `food` names a set of acceptable USDA foods below (the
# same food in any reasonable USDA form, judged by hand, not by what the matcher returns);
# `grams` is the real amount bought where the receipt says it (pack size, weight, or a count of
# things with a typical weight; `tol` widens the default 15% for counts). Items without
# `grams` have no size on the receipt and are not scored for quantity. `optional` items (not
# food you'd keep in a pantry) are neither required nor counted as false positives.
# Anything else the parser reports is a false positive (headers, totals, savings, bags...).
#
# Receipts are written in the formats of real UK and US supermarket receipts; store details are
# made up. r21-r25 were written after the parser and vocabulary were tuned (holdout).

