[project]
name = "larder-worker"
version = "0.0.0"
description = "Larder background jobs (arq): receipt OCR and parsing."
requires-python = ">=3.12"
dependencies = [
    "larder-api",
    "larder-core",
    "larder-db",
    "arq>=0.28",
    "numpy>=2.3",
    "onnxruntime>=1.30",
    "pillow>=12.0",
    # OCR engine and its bundled PP-OCR models (det/rec/cls, ~32 MB). Pinned: the models ship
    # inside the wheel, so an upgrade changes accuracy and must be re-measured
    # (make receipt-eval, docs/receipt-accuracy.md).
    "rapidocr==3.10.0",
]

[project.scripts]
larder-receipt-eval = "larder_worker.evaluate:main"

[tool.uv.sources]
larder-api = { workspace = true }
larder-core = { workspace = true }
larder-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larder_worker"]
